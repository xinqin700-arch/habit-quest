<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进化演示 · 第 3 / 7 / 14 / 21 天</title>
<style>
:root{
  --bg:#120f1e; --panel:#221a36; --line:#4a3a6e;
  --gold:#ffd76e; --mint:#7fdaad; --pink:#ff9ab5; --blue:#8fd0ff;
  --text:#efe6ff; --dim:#9a8fbd;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--text); min-height:100vh;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,ui-monospace,monospace;
  font-size:14px; line-height:1.6;
  background:
    radial-gradient(1px 1px at 12% 18%, #fff6cf 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 8%, #cfc6ff 50%, transparent 51%),
    radial-gradient(1px 1px at 42% 32%, #fff6cf 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 62%, #9f97d6 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 74%, #fff6cf 50%, transparent 51%),
    radial-gradient(1px 1px at 64% 88%, #cfc6ff 50%, transparent 51%),
    linear-gradient(#151024,#100c1b 60%,#0c0916);
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9000;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px); opacity:.5;
}
.px{image-rendering:pixelated; display:block}
.wrap{max-width:1180px; margin:0 auto; padding:34px 20px 60px}

.head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:8px}
h1{margin:0; font-size:22px; letter-spacing:2px}
h1 small{display:block; font-size:11px; color:var(--dim); letter-spacing:3px; margin-top:6px; font-weight:400}
.lead{margin:14px 0 22px; font-size:13px; color:var(--dim); max-width:640px; line-height:1.8}

.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px}
.tabs{display:flex; gap:6px; background:#1a1429; border:2px solid var(--line); padding:4px}
.tab{
  font-family:inherit; font-size:12px; letter-spacing:1px; color:var(--dim);
  background:transparent; border:0; padding:6px 14px; cursor:pointer;
}
.tab.on{background:#6b4fc4; color:#fff; box-shadow:inset -2px -2px 0 #4a2f9c, inset 2px 2px 0 #a68cf5}
#charLabel{font-size:12px; color:var(--gold); letter-spacing:2px}
#reroll{
  margin-left:auto; font-family:inherit; font-size:12px; color:#20160a; background:var(--gold);
  border:0; padding:8px 14px; cursor:pointer; font-weight:700;
  box-shadow:inset -3px -3px 0 #b07f16, inset 3px 3px 0 #ffe89a, 0 4px 0 #6f4f08;
}
#reroll:active{transform:translateY(3px); box-shadow:inset -3px -3px 0 #b07f16, inset 3px 3px 0 #ffe89a}

.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

.ms-card{
  background:linear-gradient(#241c3a,#1d1730); border:3px solid var(--line);
  box-shadow:inset 0 0 0 2px #2d2450, 0 5px 0 rgba(0,0,0,.35);
  overflow:hidden; display:flex; flex-direction:column;
}
.ms-card canvas{width:100%; height:auto; border-bottom:2px solid #332751}
.ms-body{padding:12px; display:flex; flex-direction:column; gap:6px; flex:1}
.ms-day{font-size:9px; letter-spacing:3px; color:var(--dim); font-family:ui-monospace,monospace}
.ms-name{font-size:14px; letter-spacing:1px; color:var(--gold)}
.ms-unlock{margin:4px 0; padding-left:14px; font-size:11.5px; color:#c9bde8; line-height:1.7}
.ms-unlock li::marker{color:var(--pink)}
.ms-scene{font-size:10px; color:var(--dim); font-family:ui-monospace,monospace; margin-bottom:2px}
.play-btn{
  margin-top:auto; font-family:inherit; font-size:11.5px; color:#fff; cursor:pointer;
  background:#3d8f6d; border:0; padding:9px 10px;
  box-shadow:inset -3px -3px 0 #2a6a4f, inset 3px 3px 0 #7fdaad, 0 4px 0 #1c4a37;
}
.play-btn:active{transform:translateY(3px); box-shadow:inset -3px -3px 0 #2a6a4f, inset 3px 3px 0 #7fdaad}

.foot{margin-top:26px; font-size:11.5px; color:#5f5480; line-height:1.9}
.foot b{color:var(--dim)}

/* 卡片浮层 */
#gacha{
  position:fixed; inset:0; z-index:5000; display:none; align-items:center; justify-content:center;
  background:rgba(9,7,16,.9); padding:20px; perspective:1400px;
}
#gacha.show{display:flex}
.gwrap{display:flex; flex-direction:column; align-items:center; gap:16px}
.gtitle{font-size:11px; letter-spacing:4px; color:var(--gold)}
.card3d{width:270px; height:356px; position:relative; transform-style:preserve-3d; transition:transform .78s cubic-bezier(.4,1.3,.5,1)}
.card3d.flip{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border:4px solid #5a4784; background:#191228; overflow:hidden;
  box-shadow:0 0 0 3px #0b0812, 0 14px 40px rgba(0,0,0,.6);
}
.face.back{display:grid; place-items:center; color:var(--gold); font-size:64px;
  background:repeating-linear-gradient(45deg,#1b1430 0 8px,#211838 8px 16px);}
.face.back::after{content:''; position:absolute; inset:12px; border:2px dashed rgba(255,215,110,.25)}
.face.front{transform:rotateY(180deg); display:flex; flex-direction:column}
.face.front canvas{width:100%; height:auto; border-bottom:2px solid #3a2c59}
.ginfo{padding:10px 12px; display:flex; flex-direction:column; gap:4px; flex:1}
.gstage{font-size:9px; letter-spacing:2px; color:var(--dim); font-family:ui-monospace,monospace}
.grarity{color:var(--gold); letter-spacing:2px; font-size:13px}
.gname{font-size:17px; letter-spacing:2px; color:#fff}
.gdesc{font-size:11px; color:var(--dim); line-height:1.55; margin-top:auto}
#gbtn{
  font-family:inherit; font-size:12px; font-weight:700; letter-spacing:1px;
  color:#241703; background:#d9a227; border:0; padding:10px 22px; cursor:pointer;
  box-shadow:inset -3px -3px 0 #b07f16, inset 3px 3px 0 #ffe89a, 0 4px 0 #6f4f08;
}
#gbtn:active{transform:translateY(3px); box-shadow:inset -3px -3px 0 #b07f16, inset 3px 3px 0 #ffe89a}

#fx{position:fixed; inset:0; z-index:4000; pointer-events:none}
#praiseLayer{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:6000;
  display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; width:min(92vw,520px)}
.praise{background:linear-gradient(#2a2242,#1d1730); border:3px solid var(--gold); padding:12px 16px;
  font-size:13px; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.35); animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.praise .pq{color:var(--gold); font-size:20px; line-height:0; margin-right:2px}
.praise .ph{display:block; font-size:10px; color:var(--dim); margin-top:4px; letter-spacing:1px}
.praise.out{animation:up .6s forwards}
@keyframes pop{from{opacity:0; transform:translateY(16px) scale(.94)}to{opacity:1; transform:none}}
@keyframes up{to{opacity:0; transform:translateY(-24px)}}
#toastLayer{position:fixed; left:50%; top:22px; transform:translateX(-50%); z-index:6500;
  display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none}
.toast{background:#2a2242; border:2px solid #6b4fc4; color:#fff; font-size:12px; padding:7px 14px;
  box-shadow:0 3px 0 rgba(0,0,0,.35); animation:pop .3s}
.toast.out{animation:up .5s forwards}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>进化演示<small>DAY 3 · 7 · 14 · 21 — 完成任务那一刻会发生什么</small></h1>
  </div>
  <p class="lead">
    每到一个节点，打卡会同时触发四件事：<b style="color:#ff9ab5">活力 +18</b>、<b style="color:#7fdaad">经验 +32</b>、
    <b style="color:#8fd0ff">全屏撒花 + 随机夸夸</b>、<b style="color:#ffd76e">抽卡进化</b>。
    抽到哪张卡（场景 / 称号 / 星级 / 光晕）每个人都不一样，点「重新抽卡」就能看到差异。
  </p>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab on" data-char="prince">小王子</button>
      <button class="tab" data-char="princess">小公主</button>
      <button class="tab" data-char="cat">小猫咪</button>
    </div>
    <span id="charLabel">小王子</span>

  </div>

  <div class="grid" id="grid"></div>

  <p class="foot">
    <b>怎么算「一天」</b>：当天任意一个习惯打卡成功，就算一天。三个习惯分开计数、分别累积连击。<br>
    <b>21 天之后</b>：拿到勋章卡，角色保持「加冕」形态，习惯可以继续记录，进入第 2 轮。
  </p>
</div>

<div id="gacha">
  <div class="gwrap">
    <div class="gtitle">进 化 抽 卡</div>
    <div class="card3d" id="card3d">
      <div class="face back">?</div>
      <div class="face front">
        <canvas id="gachaCanvas" width="96" height="64" class="px"></canvas>
        <div class="ginfo">
          <div class="gstage" id="gstage">STAGE 2</div>
          <div class="grarity" id="gstars">★★★</div>
          <div class="gname" id="gtitle"></div>
          <div class="gdesc" id="gdesc"></div>
        </div>
      </div>
    </div>
    <button id="gbtn">开启进化 ✦</button>
  </div>
</div>

<div id="praiseLayer"></div>
<div id="toastLayer"></div>
<canvas id="fx"></canvas>

<script>
/* ============================================================
   Habit Quest — 像素风 21 天习惯养成
   像素绘制引擎：所有角色 / 场景 / 装饰都在 96x64 逻辑网格上绘制，
   再用 CSS image-rendering: pixelated 放大，保证真像素观感。
   ============================================================ */

const SCENE_W = 96;
const SCENE_H = 64;

const C = {
  ink: '#2b2138', ink2: '#463457',
  skin: '#f8d6b2', skinS: '#e6b58c', skinD: '#c98f6a',
  gold: '#f7c948', goldD: '#d9a227', goldL: '#ffe89a',
  white: '#fdf7ea', cream: '#f3e7d1',
  mint: '#4fb286', mintD: '#337d5c', mintL: '#7fdaad',
  red: '#e0574d', redD: '#ab3a33',
  pink: '#f59ab8', pinkD: '#cf7592', pinkL: '#ffc7d8',
  blue: '#5b8fd6', blueD: '#3a64a0',
  purple: '#9b7bdc', purpleD: '#6d4fb0',
  orange: '#f0a860', orangeD: '#cd7f3a', orangeL: '#ffcb8f',
  brown: '#8a6247', brownD: '#5f4029',
  night: '#1b1733', nightL: '#2c2650'
};

/* ---------- painter：逻辑像素画笔 ---------- */
function mkPainter(ctx) {
  const P = (x, y, w, h, col) => {
    if (w <= 0 || h <= 0 || !col) return;
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  };
  P.rect = P;
  P.circle = (cx, cy, r, col) => {
    for (let y = -r; y <= r; y++) {
      for (let x = -r; x <= r; x++) {
        if (x * x + y * y <= r * r + r * 0.6) P(cx + x, cy + y, 1, 1, col);
      }
    }
  };
  P.ellipse = (cx, cy, rx, ry, col) => {
    for (let y = -ry; y <= ry; y++) {
      for (let x = -rx; x <= rx; x++) {
        const d = (x * x) / (rx * rx) + (y * y) / (ry * ry);
        if (d <= 1.05) P(cx + x, cy + y, 1, 1, col);
      }
    }
  };
  // 竖直色带（像素渐变）
  P.bands = (x, y, w, h, cols, dither) => {
    const n = cols.length;
    for (let i = 0; i < n; i++) {
      const yy = y + Math.floor((i * h) / n);
      const hh = Math.ceil(h / n);
      P(x, yy, w, hh, cols[i]);
      if (dither && i > 0) {
        for (let dx = 0; dx < w; dx++) {
          for (let dy = 0; dy < 2; dy++) {
            if ((dx + dy) % 2 === 0) P(x + dx, yy + dy, 1, 1, cols[i - 1]);
          }
        }
      }
    }
  };
  // 阶梯三角（用于沙丘/山）
  P.tri = (cx, baseY, halfW, hgt, col) => {
    for (let i = 0; i < hgt; i++) {
      const t = i / hgt;
      const w = Math.round(halfW * (1 - t)) * 2 + 1;
      P(cx - Math.floor(w / 2), baseY - i, w, 1, col);
    }
  };
  P.stairs = (x, y, w, h, col, dir) => {
    // 右上斜的阶梯块
    for (let i = 0; i < h; i++) {
      const ww = Math.round(w * (1 - i / h));
      P(dir === 'l' ? x : x + (w - ww), y + i, ww, 1, col);
    }
  };
  return P;
}

/* ============================================================
   场景绘制
   ============================================================ */
const SCENES = ['desert', 'star', 'sunrise', 'lake'];
const SCENE_NAME = { desert: '沙漠', star: '星空', sunrise: '日出', lake: '湖泊' };

function seededRand(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

function drawScene(p, name, seed) {
  const R = seededRand(seed || 7);
  const W = SCENE_W, H = SCENE_H;

  if (name === 'desert') {
    p.bands(0, 0, W, 42, ['#f9dda4', '#f5c67f', '#eda261', '#e08a58'], true);
    p.circle(74, 15, 8, '#ffe9a8');
    p.circle(74, 15, 6, '#fff6cf');
    // 远沙丘
    p.tri(20, 42, 26, 8, '#e5a163');
    p.tri(62, 42, 30, 10, '#dd9557');
    p.tri(92, 42, 18, 7, '#e8aa6b');
    // 地面
    p(0, 42, W, 6, '#e3a868');
    p(0, 46, W, 18, '#ebbb7f');
    p(0, 49, W, 15, '#dfa568');
    // 沙纹
    for (let i = 0; i < 26; i++) {
      const x = Math.floor(R() * W), y = 46 + Math.floor(R() * 16);
      p(x, y, 3 + Math.floor(R() * 4), 1, '#d59a5f');
    }
    // 仙人掌
    p(13, 36, 4, 12, '#4f8f5e');
    p(10, 40, 3, 2, '#4f8f5e'); p(10, 38, 2, 3, '#4f8f5e');
    p(17, 43, 3, 2, '#4f8f5e'); p(19, 40, 2, 4, '#4f8f5e');
    p(14, 36, 1, 12, '#63a873');
    // 石头
    p(80, 51, 6, 3, '#b9834e'); p(82, 49, 4, 2, '#c99361');
    p(30, 54, 4, 2, '#c98f57');
    // 干草
    p(46, 50, 1, 3, '#a97a45'); p(48, 49, 1, 4, '#a97a45');
  }

  if (name === 'star') {
    p.bands(0, 0, W, 46, ['#151333', '#1d1b45', '#262a5e', '#33306e'], true);
    // 星星
    for (let i = 0; i < 60; i++) {
      const x = Math.floor(R() * W), y = Math.floor(R() * 48);
      const s = R();
      if (s > 0.86) { p(x, y, 2, 2, '#fff6cf'); p(x - 1, y + 1, 4, 1, '#fff6cf'); p(x + 1, y - 1, 1, 4, '#fff6cf'); }
      else if (s > 0.5) p(x, y, 1, 1, '#e8e2ff');
      else p(x, y, 1, 1, '#9f97d6');
    }
    // 月亮
    p.circle(72, 13, 8, '#fff4c9');
    p.circle(76, 11, 7, '#1d1b45');
    // 流星
    p(20, 12, 1, 1, '#fff'); p(18, 14, 2, 1, '#cfc6ff'); p(16, 16, 3, 1, '#7d73b8');
    // 山
    p.tri(24, 52, 22, 18, '#211d43');
    p.tri(66, 52, 26, 22, '#272350');
    p.tri(48, 52, 14, 12, '#2e2a5c');
    p(0, 52, W, 12, '#1a1738');
    p(0, 55, W, 9, '#131029');
    // 湖面反光
    p(30, 57, 8, 1, '#3a3468'); p(52, 59, 12, 1, '#3a3468');
  }

  if (name === 'sunrise') {
    p.bands(0, 0, W, 44, ['#3b2a5e', '#6b4272', '#a8577a', '#d97476', '#f0a271', '#f8c98a'], true);
    // 太阳
    p.circle(48, 40, 11, '#ffe9a8');
    p.circle(48, 40, 8, '#fff8d4');
    // 云
    for (const [cx, cy, w] of [[16, 18, 16], [70, 12, 20], [40, 26, 12]]) {
      p(cx, cy, w, 3, '#c98aa8'); p(cx + 3, cy - 2, w - 8, 2, '#e0a3b4');
      p(cx, cy + 3, w, 1, '#a8708f');
    }
    // 山
    p.tri(18, 52, 24, 16, '#5a3a63');
    p.tri(58, 52, 30, 20, '#4a2f55');
    p.tri(88, 52, 16, 11, '#5a3a63');
    p(0, 50, W, 14, '#3a2646');
    p(0, 54, W, 10, '#2c1c36');
    // 草地
    for (let i = 0; i < 20; i++) {
      const x = Math.floor(R() * W);
      p(x, 57 + Math.floor(R() * 5), 1, 2, '#4a3a5e');
    }
  }

  if (name === 'lake') {
    const HZ = 30;          // 地平线（远岸）
    const SHORE = 51;       // 近岸线基准

    /* --- 天空：上冷下暖，靠近地平线泛奶油色，与青色湖面形成冷暖分界 --- */
    p.bands(0, 0, W, HZ + 1, ['#78b4cc', '#a2d1d7', '#cfe6dc', '#f3efd8'], true);
    // 太阳（偏右，给湖面倒影留位置）
    p.circle(68, 10, 7, '#fff0bd');
    p.circle(68, 10, 5, '#fffdf2');
    // 薄云
    for (const [cx, cy, w] of [[14, 8, 16], [38, 15, 12], [82, 6, 9]]) {
      p(cx, cy, w, 2, '#f6f4e4'); p(cx + 2, cy - 1, w - 6, 1, '#fdfcf3');
      p(cx, cy + 2, w, 1, '#d5e3da');
    }

    /* --- 远山：后面一层更淡，靠前一层更实 --- */
    p.tri(16, HZ, 20, 15, '#a8c6cf');
    p.tri(76, HZ, 18, 12, '#b0ccd2');
    p.tri(44, HZ, 25, 20, '#84a8b7');
    p.tri(60, HZ, 12, 9, '#93b4c0');
    // 雪顶
    p.tri(44, HZ - 16, 4, 4, '#f2f7f4');
    p.tri(16, HZ - 11, 3, 3, '#eef5f2');

    /* --- 对岸松树剪影：这一层是「湖」而非「海」的关键标识 --- */
    p(0, HZ - 1, W, 2, '#3d6a56');
    for (let i = 0; i < 18; i++) {
      const x = Math.floor(R() * W), h = 3 + Math.floor(R() * 3);
      p.tri(x, HZ - 1, 2, h, i % 3 === 0 ? '#335c4a' : '#3d6a56');
    }
    // 远岸浅色水线（岸与水的分界）
    p(0, HZ + 1, W, 1, '#c8e0d8');

    /* --- 湖面：由远及近逐层加深，形成纵向纵深 --- */
    p(0, HZ + 2, W, 6, '#8fc6ca');
    p(0, HZ + 8, W, 5, '#77b3be');
    p(0, HZ + 13, W, 5, '#61a0b1');
    p(0, HZ + 18, W, 5, '#518c9f');
    p(0, HZ + 23, W, 4, '#457f93');

    /* --- 倒影：山影用断续横条，做出水面破碎感 --- */
    const refl = (cx, halfW, hgt, col) => {
      for (let i = 0; i < hgt; i++) {
        if (i % 2) continue;
        const t = i / hgt, w = Math.round(halfW * (1 - t)) * 2 + 1;
        p(cx - Math.floor(w / 2), HZ + 2 + i, w, 1, col);
      }
    };
    refl(44, 16, 16, '#6d97a8');
    refl(16, 12, 11, '#7ba4b0');
    refl(76, 11, 9, '#7ba4b0');
    // 太阳在水面的光柱（越近越宽、越散）
    const sunCol = [[3, '#ffe9ad'], [5, '#ffeec0'], [4, '#ffe0a0'], [7, '#ffe9b4'], [5, '#f6d393'], [9, '#efcb8c'], [6, '#e2bd83']];
    sunCol.forEach(([w, col], i) => {
      p(68 - Math.floor(w / 2) + (i % 2 ? 1 : 0), HZ + 2 + i * 3, w, 1, col);
    });

    /* --- 波纹：靠近远岸的细密，靠近近岸的疏而长 --- */
    for (let i = 0; i < 40; i++) {
      const t = R();
      const y = HZ + 3 + Math.floor(t * 19);
      const x = Math.floor(R() * W);
      const w = 2 + Math.floor(t * 5 + R() * 3);
      p(x, y, w, 1, i % 4 === 0 ? '#c3e6e4' : '#5d9aa8');
    }

    /* --- 右侧木栈桥（延伸出画外），湖岸的第二重识别信号 --- */
    p(80, 46, 16, 2, '#8a5f3c');
    p(80, 46, 16, 1, '#a2744c');
    p(83, 48, 2, 4, '#6b4830'); p(89, 48, 2, 4, '#6b4830'); p(95, 48, 1, 4, '#6b4830');
    p(80, 52, 16, 1, '#4d7f8d'); // 桥影

    /* --- 水面上的浮萍与睡莲 --- */
    p.ellipse(18, 45, 4, 1, '#4f8b62'); p(19, 45, 2, 1, '#5fa071');
    p.ellipse(27, 41, 3, 1, '#4f8b62');
    p(21, 43, 2, 1, '#5fa071');
    p.circle(24, 47, 1, '#f2a8c4'); // 睡莲花

    /* --- 岸边芦苇（左侧，避免挡住人物） --- */
    p(5, 42, 1, 10, '#3f6b59'); p(4, 44, 2, 1, '#4e7f6b'); p(6, 46, 2, 1, '#4e7f6b');
    p(11, 45, 1, 7, '#4e7f6b'); p(12, 47, 2, 1, '#5d8f6b');
    p(8, 40, 1, 3, '#8a7a4e'); // 芦花

    /* --- 近岸：沙岸 + 草坡，给人物一个真正的落脚点 --- */
    for (let x = 0; x < W; x++) {
      const wob = Math.round(Math.sin(x / 6.3) * 1.4 + Math.sin(x / 2.7) * 0.5);
      const s = SHORE + wob;
      p(x, s, 1, 64 - s, '#c9bd9c');           // 干沙
      p(x, s + 2, 1, 64 - s - 2, '#7ba76b');   // 草
      p(x, s + 5, 1, 64 - s - 5, '#6a9a5e');
      p(x, 60, 1, 4, '#5c8b53');               // 前缘压深
    }
    // 沙与草之间的湿痕
    p(0, SHORE + 1, W, 1, '#d8cdaa');
    // 草簇 / 碎石 / 小野花
    for (let i = 0; i < 22; i++) {
      const x = 2 + Math.floor(R() * (W - 4));
      const y = SHORE + 4 + Math.floor(R() * 10);
      if (i % 5 === 0) { p(x, y, 1, 1, '#f7f3e2'); p(x + 1, y + 1, 1, 1, '#f2df8a'); }
      else if (i % 3 === 0) p(x, y, 2, 1, '#8fbb7a');
      else { p(x, y, 1, 2, '#5b8a52'); p(x + 2, y + 1, 1, 2, '#5b8a52'); }
    }
    // 岸边碎石
    p(30, 56, 3, 1, '#b3ab90'); p(62, 58, 4, 1, '#a9a289'); p(14, 59, 2, 1, '#b3ab90');
  }
}

/* ---------- 小王子 ---------- */
function drawPrince(p, stage, ox, oy) {
  const tall = stage >= 3;
  const cx = ox + 16;
  const hy = oy + (tall ? 1 : 4);
  const headW = 16, headH = 14;
  const hx = cx - 8;
  const bodyTop = hy + headH - 2;
  const bodyW = tall ? 14 : 13;
  const bx = cx - Math.floor(bodyW / 2);
  const bodyH = tall ? 11 : 8;
  const legTop = bodyTop + bodyH;
  const feetY = oy + 31;

  // 披风（stage>=2）
  if (stage >= 2) {
    const capeCol = stage >= 4 ? '#7c3fa8' : C.red;
    const capeColD = stage >= 4 ? '#5b2b7d' : C.redD;
    const cw = stage >= 4 ? 5 : 4;
    p(bx - cw, bodyTop, cw, bodyH + (tall ? 8 : 5), capeColD);
    p(bx + bodyW, bodyTop, cw, bodyH + (tall ? 8 : 5), capeColD);
    p(bx - cw + 1, bodyTop, 1, bodyH + (tall ? 8 : 5), capeCol);
    p(bx + bodyW, bodyTop, 1, bodyH + (tall ? 8 : 5), capeCol);
  }

  // 腿
  p(cx - 4, legTop, 3, feetY - legTop - 2, '#2f3550');
  p(cx + 1, legTop, 3, feetY - legTop - 2, '#2f3550');
  // 靴子
  p(cx - 5, feetY - 3, 4, 3, C.brownD);
  p(cx + 1, feetY - 3, 4, 3, C.brownD);
  p(cx - 5, feetY - 3, 4, 1, C.brown);

  // 身体
  p(bx, bodyTop, bodyW, bodyH, C.mint);
  p(bx, bodyTop, bodyW, 2, C.mintL);
  p(bx + bodyW - 2, bodyTop, 2, bodyH, C.mintD);
  // 手臂
  p(bx - 2, bodyTop + 2, 2, bodyH - 2, C.mintD);
  p(bx + bodyW, bodyTop + 2, 2, bodyH - 2, C.mintD);
  p(bx - 2, bodyTop + bodyH - 1, 2, 2, C.skin);
  p(bx + bodyW, bodyTop + bodyH - 1, 2, 2, C.skin);
  // 门襟 + 扣子
  p(cx - 1, bodyTop + 2, 2, bodyH - 2, C.mintD);
  p(cx - 1, bodyTop + 3, 1, 1, C.gold);
  p(cx - 1, bodyTop + 6, 1, 1, C.gold);
  // 红领巾
  p(cx - 4, bodyTop - 1, 8, 2, C.red);
  p(cx - 2, bodyTop + 1, 4, 1, C.redD);
  // 肩章（stage>=3）
  if (stage >= 3) {
    p(bx - 1, bodyTop, 3, 2, C.gold);
    p(bx + bodyW - 2, bodyTop, 3, 2, C.gold);
  }

  // 头
  p(hx - 1, hy + 2, headW + 2, 11, C.gold);       // 后发
  p(hx + 1, hy, headW - 2, 4, C.gold);            // 顶发
  p(hx + 2, hy + 3, headW - 4, 10, C.skin);       // 脸
  p(hx + 1, hy + 3, headW - 2, 2, C.gold);        // 刘海
  p(hx + 4, hy + 5, 3, 1, C.gold);
  p(hx + 9, hy + 5, 3, 1, C.gold);
  p(hx, hy + 4, 2, 9, C.goldD);                   // 鬓角
  p(hx + headW - 2, hy + 4, 2, 9, C.goldD);
  // 五官
  p(cx - 4, hy + 7, 2, 2, C.ink);
  p(cx + 2, hy + 7, 2, 2, C.ink);
  p(cx - 4, hy + 7, 1, 1, C.white);
  p(cx + 2, hy + 7, 1, 1, C.white);
  p(cx - 6, hy + 9, 2, 1, '#f0a9a0');
  p(cx + 4, hy + 9, 2, 1, '#f0a9a0');
  p(cx - 1, hy + 10, 2, 1, C.redD);

  // 王冠
  if (stage >= 3) {
    p(cx - 6, hy - 2, 12, 2, C.gold);
    p(cx - 6, hy - 4, 2, 2, C.gold);
    p(cx - 1, hy - 5, 2, 3, C.gold);
    p(cx + 4, hy - 4, 2, 2, C.gold);
    p(cx - 1, hy - 2, 1, 1, C.red);
  }
  if (stage >= 5) {
    p(cx - 6, hy - 2, 12, 1, C.goldL);
    p(cx - 3, hy - 4, 1, 2, C.goldL);
    p(cx + 3, hy - 4, 1, 2, C.goldL);
  }
  // 光环（stage>=5）
  if (stage >= 5) {
    p(cx - 7, hy - 8, 14, 1, '#ffe89a');
    p(cx - 8, hy - 7, 1, 1, '#ffe89a');
    p(cx + 7, hy - 7, 1, 1, '#ffe89a');
  }

  return { cx, headTop: hy, headW, headH, bodyTop, bodyW: bodyW, bx, feetY, neckY: bodyTop - 2, stage };
}

/* ---------- 小公主 ---------- */
function drawPrincess(p, stage, ox, oy) {
  const tall = stage >= 3;
  const cx = ox + 16;
  const hy = oy + (tall ? 1 : 4);
  const headW = 15, headH = 14;
  const hx = cx - 7;
  const bodyTop = hy + headH - 2;
  const feetY = oy + 31;
  const dressTop = bodyTop + (tall ? 6 : 5);
  const skirtW = tall ? 22 : 18;

  // 长发（背后）
  p(hx - 2, hy + 2, headW + 4, tall ? 24 : 20, '#a5703f');
  p(hx - 3, hy + 6, 2, tall ? 20 : 16, '#8d5c33');
  p(hx + headW + 1, hy + 6, 2, tall ? 20 : 16, '#8d5c33');

  // 披风/薄纱（stage>=4）
  if (stage >= 4) {
    const col = stage >= 5 ? '#cfa8f0' : '#f7c6dd';
    p(cx - skirtW / 2 - 3, dressTop, 3, feetY - dressTop - 3, col);
    p(cx + skirtW / 2, dressTop, 3, feetY - dressTop - 3, col);
  }

  // 裙摆（阶梯三角）
  for (let i = 0; i < feetY - dressTop; i++) {
    const t = i / (feetY - dressTop);
    const w = Math.round(skirtW - (skirtW - 12) * (1 - t) * 0.55) + (i > 2 ? 2 : 0);
    const ww = Math.min(skirtW, 12 + Math.round(i * 0.9));
    p(cx - Math.floor(ww / 2), dressTop + i, ww, 1, i % 6 === 5 ? C.pinkD : C.pink);
  }
  p(cx - Math.floor(skirtW / 2) + 1, feetY - 2, skirtW - 2, 2, C.pinkD);

  // 腿 + 鞋
  p(cx - 3, feetY - 4, 2, 3, C.skin);
  p(cx + 1, feetY - 4, 2, 3, C.skin);
  p(cx - 3, feetY - 1, 3, 2, '#c96a8a');
  p(cx + 1, feetY - 1, 3, 2, '#c96a8a');

  // 上身
  p(cx - 6, bodyTop, 12, tall ? 7 : 6, '#fdf0f4');
  p(cx - 6, bodyTop, 12, 1, C.white);
  p(cx - 2, bodyTop + 1, 4, 2, C.pinkL);
  // 泡泡袖
  p(cx - 9, bodyTop, 3, 4, C.pinkL);
  p(cx + 6, bodyTop, 3, 4, C.pinkL);
  p(cx - 9, bodyTop + 4, 3, 2, C.skin);
  p(cx + 6, bodyTop + 4, 3, 2, C.skin);
  // 腰带
  p(cx - 6, dressTop - 2, 12, 2, stage >= 3 ? C.gold : C.pinkD);
  p(cx - 1, dressTop - 2, 2, 2, stage >= 3 ? C.red : C.gold);

  // 头
  p(hx, hy, headW, 5, '#a5703f');
  p(hx + 2, hy + 4, headW - 4, 9, C.skin);
  p(hx + 3, hy + 4, headW - 6, 2, '#a5703f');
  p(hx, hy + 4, 2, 8, '#a5703f');
  p(hx + headW - 2, hy + 4, 2, 8, '#a5703f');
  // 五官
  p(cx - 4, hy + 7, 2, 2, C.ink);
  p(cx + 2, hy + 7, 2, 2, C.ink);
  p(cx - 4, hy + 7, 1, 1, C.white);
  p(cx + 2, hy + 7, 1, 1, C.white);
  p(cx - 6, hy + 9, 2, 1, '#f7a8b8');
  p(cx + 4, hy + 9, 2, 1, '#f7a8b8');
  p(cx - 1, hy + 10, 2, 1, C.redD);
  // 蝴蝶结
  p(cx - 7, hy - 1, 3, 2, C.red);
  p(cx + 4, hy - 1, 3, 2, C.red);

  // 王冠
  if (stage >= 2) {
    p(cx - 6, hy - 3, 12, 2, C.gold);
    p(cx - 6, hy - 5, 2, 2, C.gold);
    p(cx - 1, hy - 6, 2, 3, C.gold);
    p(cx + 4, hy - 5, 2, 2, C.gold);
    p(cx - 1, hy - 4, 1, 1, C.pink);
  } else {
    p(cx - 4, hy - 2, 8, 1, C.gold);
  }
  if (stage >= 4) {
    p(cx - 8, hy - 4, 2, 1, C.goldL);
    p(cx + 6, hy - 4, 2, 1, C.goldL);
    p(cx - 1, hy - 7, 1, 1, C.goldL);
  }
  if (stage >= 5) {
    p(cx - 7, hy - 9, 14, 1, '#ffe89a');
    p(cx - 8, hy - 8, 1, 1, '#ffe89a');
    p(cx + 7, hy - 8, 1, 1, '#ffe89a');
  }

  return { cx, headTop: hy, headW, headH, bodyTop, bodyW: 12, bx: cx - 6, feetY, neckY: bodyTop - 1, stage };
}

/* ---------- 小猫咪 ---------- */
function drawCat(p, stage, ox, oy) {
  const big = stage >= 3;
  const cx = ox + 16;
  const headW = big ? 20 : 16;
  const headH = big ? 15 : 13;
  const hy = oy + (big ? 2 : 8);
  const hx = cx - Math.floor(headW / 2);
  const feetY = oy + 31;
  const bodyTop = hy + headH - 2;
  const bodyW = big ? 18 : 14;
  const bx = cx - Math.floor(bodyW / 2);
  const bodyH = feetY - bodyTop - 4;

  // 尾巴
  const tailCol = C.orange, tailD = C.orangeD;
  if (stage >= 2) {
    p(bx + bodyW, bodyTop + 3, 3, 3, tailCol);
    p(bx + bodyW + 2, bodyTop + 1, 2, 3, tailCol);
    p(bx + bodyW + 3, bodyTop - 2, 2, 4, tailCol);
    p(bx + bodyW + 3, bodyTop - 3, 2, 2, C.cream);
    if (stage >= 4) { p(bx + bodyW + 1, bodyTop + 5, 2, 3, tailD); }
  } else {
    p(bx + bodyW, bodyTop + 6, 3, 2, tailCol);
    p(bx + bodyW + 1, bodyTop + 4, 2, 3, tailCol);
  }

  // 身体
  p(bx, bodyTop, bodyW, bodyH, C.orange);
  p(bx, bodyTop, bodyW, 1, C.orangeL);
  p(bx + bodyW - 1, bodyTop, 1, bodyH, C.orangeD);
  // 胸口奶油色
  p(cx - 3, bodyTop + 2, 6, bodyH - 3, C.cream);
  // 前爪
  p(cx - 6, feetY - 3, 5, 3, C.cream);
  p(cx + 1, feetY - 3, 5, 3, C.cream);
  p(cx - 6, feetY - 1, 5, 1, '#e7d5b4');

  // 头
  p(hx + 1, hy + 2, headW - 2, headH - 1, C.orange);
  p(hx + 2, hy + 3, headW - 4, headH - 3, C.orange);
  // 耳朵
  p(hx, hy - 2, 5, 6, C.orange);
  p(hx + headW - 5, hy - 2, 5, 6, C.orange);
  p(hx + 1, hy - 1, 3, 4, C.pinkL);
  p(hx + headW - 4, hy - 1, 3, 4, C.pinkL);
  p(hx, hy - 3, 4, 2, C.orangeD);
  p(hx + headW - 4, hy - 3, 4, 2, C.orangeD);
  // 脸部浅色
  p(cx - 6, hy + 7, 12, 6, C.cream);
  // 眼睛
  if (stage === 5) {
    p(cx - 5, hy + 6, 2, 2, C.gold); p(cx + 3, hy + 6, 2, 2, C.gold);
    p(cx - 5, hy + 6, 1, 1, C.white); p(cx + 3, hy + 6, 1, 1, C.white);
  } else {
    p(cx - 5, hy + 6, 2, 3, C.ink); p(cx + 3, hy + 6, 2, 3, C.ink);
    p(cx - 5, hy + 6, 1, 1, C.white); p(cx + 3, hy + 6, 1, 1, C.white);
  }
  // 鼻子 + 嘴
  p(cx - 1, hy + 9, 2, 1, C.pinkD);
  p(cx - 1, hy + 10, 1, 1, C.orangeD);
  p(cx + 1, hy + 10, 1, 1, C.orangeD);
  // 胡须
  p(cx - 9, hy + 9, 3, 1, '#c98f5c');
  p(cx - 9, hy + 11, 3, 1, '#c98f5c');
  p(cx + 6, hy + 9, 3, 1, '#c98f5c');
  p(cx + 6, hy + 11, 3, 1, '#c98f5c');
  // 腮红
  p(cx - 7, hy + 9, 2, 1, '#f7b2a0');
  p(cx + 5, hy + 9, 2, 1, '#f7b2a0');

  // 项圈
  const collarCol = stage >= 4 ? C.gold : C.red;
  p(cx - 6, bodyTop - 1, 12, 2, collarCol);
  p(cx - 1, bodyTop + 1, 2, 2, C.goldL);
  if (stage >= 3) { p(cx - 8, bodyTop - 1, 2, 2, C.goldL); p(cx + 6, bodyTop - 1, 2, 2, C.goldL); }

  // 王冠（stage>=4）/ 光环（stage 5）
  if (stage >= 4) {
    p(cx - 5, hy - 6, 10, 2, C.gold);
    p(cx - 5, hy - 8, 2, 2, C.gold);
    p(cx - 1, hy - 9, 2, 3, C.gold);
    p(cx + 3, hy - 8, 2, 2, C.gold);
    p(cx - 1, hy - 7, 1, 1, C.pink);
  }
  if (stage >= 5) {
    p(cx - 7, hy - 12, 14, 1, '#ffe89a');
    p(cx - 8, hy - 11, 1, 1, '#ffe89a');
    p(cx + 7, hy - 11, 1, 1, '#ffe89a');
    p(cx - 10, hy + 4, 1, 1, '#fff6cf'); p(cx + 10, hy + 2, 1, 1, '#fff6cf');
  }

  return { cx, headTop: hy, headW, headH, bodyTop, bodyW, bx, feetY, neckY: bodyTop - 1, stage, cat: true };
}

/* ---------- 绘制 ---------- */
function paintCard(cv, i) {

  ctx.clearRect(0, 0, 96, 64);

function render() {

/* ---------- 撒花 ---------- */
const fxc = () => $('#fx');
let parts = [], raf = null;
const COLORS = ['#ffd76e', '#7fdaad', '#8fd0ff', '#f59ab8', '#c9a8ff', '#ffb27a', '#fff8ec'];

function resizeFx() {
  const cv = fxc();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
}

function confetti(n = 100) {
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) {
    parts.push({
      x: W / 2 + (Math.random() - 0.5) * W * 0.55,
      y: H * 0.3 + (Math.random() - 0.5) * 80,
      vx: (Math.random() - 0.5) * 7.5, vy: -6 - Math.random() * 8,
      w: 4 + Math.random() * 6, h: 4 + Math.random() * 6,
      c: pick(COLORS), g: .24 + Math.random() * .12, a: 1
    });
  }
  if (!raf) raf = requestAnimationFrame(loop);
}
function loop() {
  const cv = fxc(), ctx = cv.getContext('2d');
  const W = innerWidth, H = innerHeight;
  ctx.clearRect(0, 0, W, H);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .99;
    if (p.y > H * .7) p.a -= .03;
    ctx.globalAlpha = Math.max(0, p.a);
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w, p.h);
  });
  ctx.globalAlpha = 1;
  parts = parts.filter(p => p.a > 0 && p.y < H + 40);
  if (parts.length) raf = requestAnimationFrame(loop);
  else { raf = null; ctx.clearRect(0, 0, W, H); }
}

/* ---------- 夸夸 ---------- */
function praise(text, tag) {
  const el = document.createElement('div');
  el.className = 'praise';
  el.innerHTML = `<span class="pq">“</span>${text}<span class="ph">—「${tag}」</span>`;
  $('#praiseLayer').appendChild(el);
  setTimeout(() => el.classList.add('out'), 2400);
  setTimeout(() => el.remove(), 3000);
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('#toastLayer').appendChild(el);
  setTimeout(() => el.classList.add('out'), 2000);
  setTimeout(() => el.remove(), 2500);
}

/* ---------- 播放一天的打卡 ---------- */
let playing = false;
function play(i) {
  if (playing) return;
  playing = true;
  const m = MILESTONES[i], r = rolls[i];

  confetti(120);
  praise(pick(PRAISES), `第 ${m.day} 天 · 打卡`);
  toast(`活力 +18 · 经验 +32 · 掉落一条奖励`);

  // 卡片
  const cv = $('#gachaCanvas');
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 96, 64);
  const p = mkPainter(ctx);
  drawScene(p, r.scene, 11 + m.stage * 13);
  ctx.globalAlpha = 0.2; p.ellipse(48, 56, 18, 4, r.aura); ctx.globalAlpha = 1;
  p.ellipse(48, 57, 10, 2, 'rgba(20,10,30,0.22)');
  CHARS[curChar].draw(p, m.stage, 32, 26);

  $('#gstars').textContent = '★'.repeat(r.rarity);
  $('#gtitle').textContent = r.title;
  $('#gdesc').textContent = SCENE_DESC[r.scene];
  $('#gstage').textContent = `STAGE ${m.stage} · ${m.name} · 第 ${m.day} 天`;
  $('#gbtn').textContent = '开启进化 ✦';

  const ov = $('#gacha');
  ov.classList.add('show');
  $('#card3d').classList.remove('flip');
  blip(520);

  setTimeout(() => {
    $('#card3d').classList.add('flip');
    blip(990);
    setTimeout(() => {
      confetti(140);
      $('#gbtn').textContent = '看到了，继续 →';
    }, 600);
  }, 900);
}

function closeGacha() {
  $('#gacha').classList.remove('show');
  playing = false;
}

/* ---------- 音效 ---------- */
let actx = null;
function blip(freq = 700, dur = .07) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq; g.gain.value = .035;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch (e) { }
}

/* ---------- 初始化 ---------- */
function init() {
  resizeFx();
  render();

  $$('.tab').forEach(t => t.onclick = () => {
    $$('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    curChar = t.dataset.char;
    $('#charLabel').textContent = CHARS[curChar].name;
    render();
  });

  $('#reroll').onclick = () => {
    rolls = MILESTONES.map((m, i) => {
      let pool = SCENES.filter(s => s !== rolls[i].scene);
      const sc = pick(pool);
      return { scene: sc, title: pick(TITLES[sc]), rarity: Math.random() > .8 ? 5 : Math.random() > .45 ? 4 : 3, aura: pick(AURAS) };
    });
    render();
    toast('已重新抽卡：每次进化都是随机的');
  };

  $('#gbtn').onclick = closeGacha;
  window.addEventListener('resize', resizeFx);
}

document.addEventListener('DOMContentLoaded', init);
